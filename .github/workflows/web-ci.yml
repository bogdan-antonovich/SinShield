name: Web CI

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-cd.yml"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit:ci

  build:
    name: Production build
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinshield-web-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
