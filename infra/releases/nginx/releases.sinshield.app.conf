server {
    listen 80;
    listen [::]:80;

    server_name releases.sinshield.app;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name releases.sinshield.app;
    root /srv/www/releases.sinshield.app;

    ssl_certificate /etc/letsencrypt/live/releases.sinshield.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/releases.sinshield.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SinShieldReleasesTLS:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    access_log off;

    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Set-Cookie $sinshield_release_cookie always;

    types {
        application/json json;
        application/octet-stream aab apk;
        text/plain sha256;
    }
    default_type application/octet-stream;

    location / {
        if ($sinshield_release_authorized = 0) {
            return 404;
        }

        limit_except GET HEAD {
            deny all;
        }

        autoindex on;
        autoindex_exact_size off;
        try_files $uri $uri/ =404;
    }
}
