<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <style>
      /*
       * Built pages include crawlable fallback markup inside #app. Hide that
       * simplified markup when JavaScript is available so it cannot flash
       * before Vue replaces it with the fully styled page.
       */
      html.js #app:not([data-v-app]) {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add('js')
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/src/assets/fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="/sinshield-thumbnail.jpg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="/sinshield-thumbnail.jpg">
    <title>SinShield</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
